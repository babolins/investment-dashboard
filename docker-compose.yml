services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-}
    restart: unless-stopped
    environment:
      - APP_ENV=${APP_ENV:-production}
      - CONFIG_PATH=${CONFIG_PATH:-/etc/investment-dashboard/config.yaml}
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      # Writable: category edits made in the UI are saved back to this file.
      - ./backend/config.yaml:/etc/investment-dashboard/config.yaml

networks:
  default:
    name: ${COMPOSE_NETWORK:-investment-dashboard}

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-}
    restart: unless-stopped
    environment:
      - APP_ENV=${APP_ENV:-production}
      - CONFIG_PATH=${CONFIG_PATH:-/etc/investment-dashboard/config.yaml}
    volumes:
      - ${CONFIG_VOLUME:-./etc-investment-dashboard}:/etc/investment-dashboard

networks:
  default:
    name: ${COMPOSE_NETWORK:-investment-dashboard}
    external: true
# CI: lint, type-check, test and build both halves of the app on every push to
# main and every pull request. No Docker here; the image build is separate.
#
# Note: action major versions below were chosen offline and could not be checked
# against the latest releases; Dependabot (.github/dependabot.yml) will bump them.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel superseded PR runs, but never a run on main.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Python version comes from backend/.python-version (uv fetches it).
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff check)
        run: uv run ruff check app tests

      - name: Check formatting (ruff format)
        run: uv run ruff format --check app tests

      - name: Type-check (pyright)
        run: uv run pyright

      - name: Run tests (pytest)
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Check formatting (Prettier)
        run: npm run format:check

      - name: Type-check (svelte-check)
        run: npm run check

      - name: Run tests (Vitest)
        run: npm test

      - name: Build
        run: npm run build
